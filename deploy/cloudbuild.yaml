# CI/CD for one release: build -> push -> migrate (Cloud Run Job) -> deploy API -> deploy web.
#   gcloud builds submit --config deploy/cloudbuild.yaml --substitutions=_API_URL=https://cases-api-....run.app
# One-time infrastructure (Cloud SQL, secret, service account, the job itself) is in deploy/README.md.
substitutions:
  _REGION: europe-west1
  _REPO: cases
  _SQL_INSTANCE: cases-db
  _SA: cases-api
  _API_URL: ""

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$BUILD_ID", backend]

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID", frontend]
    waitFor: ["-"]

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$BUILD_ID"]
    waitFor: [build-api]

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs update cases-migrate --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$BUILD_ID
        gcloud run jobs execute cases-migrate --region ${_REGION} --wait
    waitFor: [push-api]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cases-api
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$BUILD_ID
      - --service-account=${_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=database-url:latest
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION}
      - --allow-unauthenticated
    waitFor: [migrate]

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID"]
    waitFor: [build-web]

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cases-web
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID
      - --set-env-vars=API_URL=${_API_URL}
      - --allow-unauthenticated
    waitFor: [push-web, deploy-api]
