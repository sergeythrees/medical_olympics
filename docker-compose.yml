services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cases
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  # One-shot: schema migrations + demo cases. On GCP this is a Cloud Run Job.
  migrate:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/cases
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/cases
    env_file:  # LLM credentials for POST /extract (DEEPSEEK_API_KEY or GEMINI_API_KEY), see .env.example
      - path: ./backend/.env
        required: false
    ports: ["8000:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on: [api]
